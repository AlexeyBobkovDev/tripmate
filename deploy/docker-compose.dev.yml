services:
  # App service
  app:
    build:
      context: ..
      dockerfile: services/app/cmd/app/Dockerfile
    container_name: app
    env_file: ../.env
    user: "${UID:?UID is not set up}:${GID:?GID is not set up}"
    environment:
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ../services/app/out/logs:/app/out/logs
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      app-postgres:
        condition: service_healthy
      route-generator:
        condition: service_healthy
    networks:
      - app-network
      - backend-network
    healthcheck:
      test: ["CMD", "curl -fsS http://localhost:${APP_PORT}/healthcheck"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 10s

  app-postgres:
    image: postgres:18.4-bookworm
    container_name: app-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - app_pgdata:/var/lib/postgresql
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 15s

  # Route generator service
  route-generator:
    build:
      context: ..
      dockerfile: services/route_generator/cmd/route_generator/Dockerfile
    container_name: route-generator
    env_file: ../.env
    user: "${UID:?UID is not set up}:${GID:?GID is not set up}"
    environment:
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ../services/route_generator/out/logs:/app/out/logs
    restart: always
    ports:
      - "${ROUTE_GENERATOR_PORT}:${ROUTE_GENERATOR_PORT}"
    depends_on:
      route-generator-postgres:
        condition: service_healthy
    networks:
      - route-generator-network
      - backend-network
    healthcheck:
      test:
        [
          "CMD",
          "/bin/grpc_health_probe",
          "--addr=localhost:${ROUTE_GENERATOR_PORT}",
        ]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 10s

  route-generator-postgres:
    image: postgres:18.4-bookworm
    container_name: route-generator-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - route_generator_pgdata:/var/lib/postgresql
    restart: always
    networks:
      - route-generator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 15s

  # Help services
  postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: postgres-migrate
    network_mode: host
    user: "${UID:?UID is not set up}:${GID:?GID is not set up}"

  app-postgres-port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: app-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:app-postgres:5432
    networks:
      - app-network
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT}:5432"

  route-generator-postgres-port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: route-generator-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:route-generator-postgres:5432
    networks:
      - route-generator-network
    ports:
      - "127.0.0.1:${ROUTE_GENERATOR_POSTGRES_PORT}:5432"

  swagger:
    build:
      context: ..
      dockerfile_inline: |
        FROM golang:1.27.3-alpine
        RUN apk add --no-cache git
        RUN --mount=type=cache,target=go/pkg/mod \
            --mount=type=cache,target=/root/.cache/go-build \
            go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
        WORKDIR /code
        ENTRYPOINT ["swag"]
    container_name: swagger

volumes:
  app_pgdata:
    name: app_pgdata
  route_generator_pgdata:
    name: route_generator_pgdata

networks:
  app-network:
    name: app-network
  route-generator-network:
    name: route-generator-network
  backend-network:
    name: backend-network
