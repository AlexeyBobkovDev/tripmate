basePath: /api/v1
consumes:
- application/json
definitions:
  core_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  users_transport_http.CreateUserRequest:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      description:
        example: Some kind of description
        maxLength: 1000
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      name:
        example: Name
        maxLength: 50
        minLength: 1
        type: string
      password:
        example: some-random-ROBUST-password-1234!!!
        maxLength: 100
        minLength: 8
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        maxLength: 50
        minLength: 1
        type: string
      username:
        example: Username
        maxLength: 100
        minLength: 1
        type: string
    required:
    - birth_date
    - email
    - name
    - password
    - phone_number
    - surname
    - username
    type: object
  users_transport_http.PatchUserRequest:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      description:
        example: Some kind of description
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      name:
        example: Name
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        type: string
      username:
        example: Username
        type: string
      version:
        example: 1
        minimum: 1
        type: integer
    type: object
  users_transport_http.UserResponse:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      created_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      deleted_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      description:
        example: Some kind of description
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Name
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        type: string
      updated_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      username:
        example: Username
        type: string
      version:
        example: 5
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: tripmatesupport@gmail.com
    name: TripMate support
  description: |-
    TripMate is the service that helps you plan your route and just travel
    without difficulties
  title: TripMate API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
      - application/json
      description: Creates a new user
      operationId: create-user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Create User
      tags:
      - users
  /users/{userID}:
    delete:
      description: Deletes a user
      operationId: delete-user
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: Deleted user
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Delete User
      tags:
      - users
    get:
      description: Gets a user
      operationId: get-user
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "200":
          description: Successfully retrieved user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Get User
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Partially updates a user by ID
        If a field is not sent, the field won't be changed
        If a field is sent with the value of null, the field will be changed to null
        If a field is sent with an ordinary value, the field will be changed to this value
        If Birthdate is set as null, ErrBadRequest(400 status code) is returned
      operationId: patch-user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.PatchUserRequest'
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Patched user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Patch User
      tags:
      - users
produces:
- application/json
swagger: "2.0"
