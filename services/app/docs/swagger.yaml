basePath: /api/v1
consumes:
- application/json
definitions:
  core_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  domain.Interest:
    enum:
    - history
    - nature
    - food
    - architecture
    type: string
    x-enum-varnames:
    - InterestHistory
    - InterestNature
    - InterestFood
    - InterestArchitecture
  domain.Location:
    properties:
      latitude:
        example: 55.7539
        type: number
      longitude:
        example: 37.6208
        type: number
      name:
        example: Red Square
        maxLength: 100
        minLength: 1
        type: string
    required:
    - latitude
    - longitude
    - name
    type: object
  domain.Money:
    properties:
      amount_minor_units:
        example: 1500000
        minimum: 1
        type: integer
      currency:
        example: RUB
        type: string
    required:
    - amount_minor_units
    - currency
    type: object
  trips_transport_http.CreateTripRequest:
    properties:
      budget:
        $ref: '#/definitions/domain.Money'
      end_date:
        example: "2026-11-16"
        type: string
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        minItems: 1
        type: array
      name:
        example: Walk around Moscow
        maxLength: 100
        minLength: 1
        type: string
      planning_area:
        example: Moscow
        maxLength: 100
        minLength: 1
        type: string
      start_date:
        example: "2026-11-14"
        type: string
      start_location:
        $ref: '#/definitions/domain.Location'
      time_zone:
        example: Europe/Moscow
        type: string
    required:
    - budget
    - end_date
    - interests
    - name
    - planning_area
    - start_date
    - start_location
    - time_zone
    type: object
  trips_transport_http.PatchTripRequest:
    properties:
      budget:
        $ref: '#/definitions/domain.Money'
      end_date:
        example: "2026-11-16"
        type: string
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      name:
        example: Walk around NYC
        type: string
      planning_area:
        example: NYC
        type: string
      start_date:
        example: "2026-11-14"
        type: string
      start_location:
        $ref: '#/definitions/domain.Location'
      time_zone:
        example: Europe/Moscow
        type: string
      version:
        example: 5
        minimum: 1
        type: integer
    type: object
  trips_transport_http.TripResponse:
    properties:
      budget:
        $ref: '#/definitions/domain.Money'
      created_at:
        example: "2026-10-28T12:00:00Z"
        type: string
      deleted_at:
        example: ""
        type: string
      end_date:
        example: "2026-11-16T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      interests:
        items:
          $ref: '#/definitions/domain.Interest'
        type: array
      name:
        example: Walk around Moscow
        type: string
      owner_id:
        example: 1
        type: integer
      planning_area:
        example: Moscow
        type: string
      start_date:
        example: "2026-11-14T00:00:00Z"
        type: string
      start_location:
        $ref: '#/definitions/domain.Location'
      time_zone:
        example: Europe/Moscow
        type: string
      updated_at:
        example: "2026-10-28T12:00:00Z"
        type: string
      version:
        example: 1
        type: integer
    type: object
  users_transport_http.CreateUserRequest:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      description:
        example: Some kind of description
        maxLength: 1000
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      name:
        example: Name
        maxLength: 50
        minLength: 1
        type: string
      password:
        example: some-random-ROBUST-password-1234!!!
        maxLength: 100
        minLength: 8
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        maxLength: 50
        minLength: 1
        type: string
      username:
        example: Username
        maxLength: 100
        minLength: 1
        type: string
    required:
    - birth_date
    - email
    - name
    - password
    - phone_number
    - surname
    - username
    type: object
  users_transport_http.PatchUserRequest:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      description:
        example: Some kind of description
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      name:
        example: Name
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        type: string
      username:
        example: Username
        type: string
      version:
        example: 1
        minimum: 1
        type: integer
    type: object
  users_transport_http.UserResponse:
    properties:
      birth_date:
        example: "2006-01-02"
        type: string
      created_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      deleted_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      description:
        example: Some kind of description
        type: string
      email:
        example: checkemail@gmail.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Name
        type: string
      phone_number:
        example: "+79990746978"
        type: string
      surname:
        example: Surname
        type: string
      updated_at:
        example: "2006-01-02T15:06:07.292454Z"
        type: string
      username:
        example: Username
        type: string
      version:
        example: 5
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: tripmatesupport@gmail.com
    name: TripMate support
  description: |-
    TripMate is the service that helps you plan your route and just travel
    without difficulties
  title: TripMate API
  version: "1.0"
paths:
  /trips/{ownerID}:
    get:
      description: Gets trips
      operationId: get-trips
      parameters:
      - description: OwnerID ID
        in: path
        name: ownerID
        required: true
        type: integer
      responses:
        "200":
          description: Successfully retrieved trip
          schema:
            $ref: '#/definitions/trips_transport_http.TripResponse'
        "400":
          description: Invalid trip ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Gets Trip
      tags:
      - trips
    post:
      consumes:
      - application/json
      description: Creates a new trip
      operationId: create-trip
      parameters:
      - description: OwnerID ID
        in: path
        name: ownerID
        required: true
        type: integer
      - description: Trip data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trips_transport_http.CreateTripRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created trip
          schema:
            $ref: '#/definitions/trips_transport_http.TripResponse'
        "400":
          description: Invalid trip data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Create Trip
      tags:
      - trips
  /trips/{ownerID}/{tripID}:
    delete:
      description: Deletes a trip
      operationId: delete-trip
      parameters:
      - description: OwnerID ID
        in: path
        name: ownerID
        required: true
        type: integer
      - description: Trip ID
        in: path
        name: tripID
        required: true
        type: integer
      responses:
        "204":
          description: Deleted trip
        "400":
          description: Invalid trip ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Delete Trip
      tags:
      - trips
    get:
      description: Gets a trip
      operationId: get-trip
      parameters:
      - description: OwnerID ID
        in: path
        name: ownerID
        required: true
        type: integer
      - description: Trip ID
        in: path
        name: tripID
        required: true
        type: integer
      responses:
        "200":
          description: Successfully retrieved trip
          schema:
            $ref: '#/definitions/trips_transport_http.TripResponse'
        "400":
          description: Invalid trip ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Get Trip
      tags:
      - trips
    patch:
      consumes:
      - application/json
      description: |-
        Partially updates a trip by ID
        If a field is not sent, the field won't be changed
        If a field is sent with the value of null, the field will be changed to null
        If a field is sent with an ordinary value, the field will be changed to this value
        If Birthdate is set as null, ErrBadRequest(400 status code) is returned
      operationId: patch-trip
      parameters:
      - description: Trip data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trips_transport_http.PatchTripRequest'
      - description: OwnerID ID
        in: path
        name: ownerID
        required: true
        type: integer
      - description: Trip ID
        in: path
        name: tripID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Patched trip
          schema:
            $ref: '#/definitions/trips_transport_http.TripResponse'
        "400":
          description: Invalid trip data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Trip not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Patch Trip
      tags:
      - trips
  /users:
    post:
      consumes:
      - application/json
      description: Creates a new user
      operationId: create-user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Create User
      tags:
      - users
  /users/{userID}:
    delete:
      description: Deletes a user
      operationId: delete-user
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: Deleted user
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Delete User
      tags:
      - users
    get:
      description: Gets a user
      operationId: get-user
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "200":
          description: Successfully retrieved user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Get User
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Partially updates a user by ID
        If a field is not sent, the field won't be changed
        If a field is sent with the value of null, the field will be changed to null
        If a field is sent with an ordinary value, the field will be changed to this value
        If Birthdate is set as null, ErrBadRequest(400 status code) is returned
      operationId: patch-user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.PatchUserRequest'
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Patched user
          schema:
            $ref: '#/definitions/users_transport_http.UserResponse'
        "400":
          description: Invalid user data
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Patch User
      tags:
      - users
produces:
- application/json
swagger: "2.0"
