services:
  app:
    build:
      context: .
      dockerfile: ./cmd/app/Dockerfile
    container_name: app
    env_file: .env
    environment:
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ./out/logs:/app/out/logs
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/healthcheck"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 10s

  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 15s

  postgres-migrate:
    image: migrate/migrate:v1.27.0
    container_name: postgres-migrate
    volumes:
      - ./migrations:/migrations

  postgres-port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.27.0-alpine
        RUN apk add --no-cache git
        RUN --mount=type=cache,target=go/pkg/mod \
            --mount=type=cache,target=/root/.cache/go-build \
            go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
        WORKDIR /code
        ENTRYPOINT ["swag"]
    environment:
      - APP_SERVICE_NAME=${APP_SERVICE_NAME}
    container_name: swagger
    volumes:
      - .:/code

volumes:
  pgdata:
