syntax = "proto3";

package tripmate.route_generator.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "tripmate/route_generator/api/v1/enums.proto";

option go_package = "github.com/AlexeyBobkovDev/tripmate/contracts/gen/go/tripmate/route_generator/api/v1;route_generator_api_v1";

message RouteLeg {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];

  int32 from_stop_id = 2 [(buf.validate.field).int32.gt = 0];
  int32 to_stop_id = 3 [(buf.validate.field).int32.gt = 0];

  TravelMode travel_mode = 4 [(buf.validate.field).enum.defined_only = true];
  int32 distance = 5 [(buf.validate.field).int32.gt = 0];
  google.protobuf.Duration duration = 6 [(buf.validate.field).duration.gt = {seconds: 0}];
}
