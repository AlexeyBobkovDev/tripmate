syntax = "proto3";

package tripmate.route_generator.api.v1;

import "buf/validate/validate.proto";
import "tripmate/route_generator/api/v1/enums.proto";
import "tripmate/route_generator/api/v1/route_day.proto";

option go_package = "github.com/AlexeyBobkovDev/tripmate/contracts/gen/go/tripmate/route_generator/api/v1;route_generator_api_v1";

message GenerateRouteResponse {
  RouteStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  repeated RouteDay days = 2 [(buf.validate.field).repeated.min_items = 1];
}
