syntax = "proto3";

package tripmate.route_generator.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "tripmate/route_generator/api/v1/enums.proto";
import "tripmate/route_generator/common/v1/coordinates.proto";

option go_package = "github.com/AlexeyBobkovDev/tripmate/contracts/gen/go/tripmate/route_generator/api/v1;route_generator_api_v1";

message GenerateRouteRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  int64 owner_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 version = 3 [(buf.validate.field).int64.gt = 0];

  string name = 4 [(buf.validate.field).string.min_len = 1];
  string planning_area = 5 [(buf.validate.field).string.min_len = 1];
  tripmate.route_generator.common.v1.Coordinates start_coordinates = 6;

  google.protobuf.Timestamp start_date = 7;
  google.protobuf.Timestamp end_date = 8;

  repeated Interest interests = 9 [(buf.validate.field).repeated.min_items = 1];
  string time_zone = 10 [(buf.validate.field).string.pattern = "Europe/Moscow"];
}
