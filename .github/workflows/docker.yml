name: Docker

on:
  workflow_call:

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: "app"
            module: "services/app"

    steps:
      - name: Checkout Go code
        uses: actions/checkout@v7.0.1

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: alexeybobkovdev/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enabled=${{ startsWith(github.ref_name, 'refs/tags/') }}

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.module }}
          push: true
          file: ${{ matrix.module }}/cmd/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
