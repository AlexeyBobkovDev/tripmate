name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ["services/app", "services/notification"]

    steps:
      - name: Checkout Go files
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: true

      - name: Check formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install mvdan.cc/gofumpt@latest
          go install github.com/daixiang0/gci@latest

          readarray -t FILES < <(find -name '*.go' -type f)

          unformatted="$(gofmt -l "${FILES[@]}")"  || exit 1
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          unformatted="$(goimports -l "${FILES[@]}")"  || exit 1
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          unformatted="$(gofumpt -l "${FILES[@]}")"  || exit 1
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

          unformatted="$(gci diff \
              --custom-order \
              -s standard \
              -s default \
              -s "prefix(github.com/AlexeyBobkovDev/tripmate)" \
              "${FILES[@]}"
          )" || exit 1
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.service }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.service }}
