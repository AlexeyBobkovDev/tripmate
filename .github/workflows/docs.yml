name: Docs

on:
  workflow_call:

jobs:
  check-docs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: "app"
            module: "services/app"

    steps:
      - name: Check out project files
        uses: actions/checkout@v7.0.1

      - name: Prepare Dockerfile
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/Dockerfile.swag" <<'EOF'
          FROM golang:1.27.3-alpine
          RUN go install github.com/swaggo/swag/cmd/swag@latest
          WORKDIR /code
          ENTRYPOINT ["swag"]
          EOF

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build swaggo image for Go
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.module }}
          file: ${{ runner.temp }}/Dockerfile.swag
          tags: swaggo-golang-${{ matrix.service }}
          load: true
          cache-from: type=gha,scope=swaggo-app
          cache-to: type=gha,mode=max,scope=swaggo-app

      - name: Generate docs
        run: |
          (
            if (( $(
              cd "${{ matrix.module }}"
              docker run --rm -v $(pwd):/code swaggo-golang-${{ matrix.service }} \
                init \
                -g cmd/${{ matrix.service }}/main.go \
                -o docs \
                --parseInternal |
              grep -v "error: execute go list command" |
              grep error |
              wc -l
            ) != 0 )); then
              printf "\033[31mError while generating the documentation\033[0m\n"
              exit 1
            fi

            if [ -n $(git status | grep -E "(docs.go|swagger.yaml|swagger.json)") ]; then
              printf "\033[31mThe documentation is not regenerated by you\033[0m\n"
              exit 1
            fi

            printf "\033[32mThe documentation is generated correctly\033[0m\n"
            exit 0
          )
